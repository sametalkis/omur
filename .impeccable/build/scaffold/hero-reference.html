<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b-sequence.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barrio:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#ce3827}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-washi-ground region texture" data-region="washi-ground" style="background-image:url('../../../assets/plates/washi-ground.png');background-repeat:repeat"></div>
  <div class="r-age-counter region text" data-region="age-counter"><!-- Monumental age counter '23.604812' in heavy sumi-black numerals --><p style="line-height:1.05;margin:0">age-counter</p></div>
  <div class="r-gold-dot region control" data-region="gold-dot"><!-- Small gold dot at the decimal point of the age counter: rebuild the control's chrome from the crop (comp-spec.mjs --crop gold-dot); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-crease-line region chrome" data-region="crease-line"><!-- Horizontal fold-white crease line spanning full width, separating counter from goals --></div>
  <figure class="r-card-1-plate region plate" data-region="card-1-plate"><img src="../../../assets/plates/card-1-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-card-2-figure region plate" data-region="card-2-figure"><img src="../../../assets/plates/card-2-figure.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-2-text region text" data-region="card-2-text"><!-- Goal title 'Flat the goal' on card 2 in humanist sans --><p style="line-height:1.05;margin:0">card-2-text</p></div>
  <figure class="r-card-3-figure region plate" data-region="card-3-figure"><img src="../../../assets/plates/card-3-figure.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-3-text region text" data-region="card-3-text"><!-- Goal title 'Seeing the goal' on card 3 --><p style="font-size:var(--r-card-3-text-font);line-height:1.05;margin:0">card-3-text</p></div>
  <figure class="r-card-4-figure region plate" data-region="card-4-figure"><img src="../../../assets/plates/card-4-figure.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-4-text region text" data-region="card-4-text"><!-- Goal title 'Folding goal' on card 4 --><p style="font-size:var(--r-card-4-text-font);font-family:var(--r-card-4-text-family),sans-serif;font-weight:var(--r-card-4-text-weight);line-height:1.05;margin:0">card-4-text</p></div>
  <figure class="r-card-5-figure region plate" data-region="card-5-figure"><img src="../../../assets/plates/card-5-figure.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-5-text region text" data-region="card-5-text"><!-- Goal title 'Origami crane' on card 5 --><p style="font-size:var(--r-card-5-text-font);line-height:1.05;margin:0">card-5-text</p></div>
  <figure class="r-card-6-figure region plate" data-region="card-6-figure"><img src="../../../assets/plates/card-6-figure.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-dashed-crease region chrome" data-region="dashed-crease"><!-- Horizontal dashed fold-white crease line connecting all goal cards in sequence --></div>
  <figure class="r-card-2-diagram region plate" data-region="card-2-diagram"><img src="../../../assets/plates/card-2-diagram.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-card-3-diagram region plate" data-region="card-3-diagram"><img src="../../../assets/plates/card-3-diagram.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-card-4-diagram region plate" data-region="card-4-diagram"><img src="../../../assets/plates/card-4-diagram.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-card-5-diagram region plate" data-region="card-5-diagram"><img src="../../../assets/plates/card-5-diagram.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-hedef-ekle region text" data-region="hedef-ekle"><!-- 'HEDEF EKLE' action label in small tracked caps, ink-fade gray --><p style="font-size:var(--r-hedef-ekle-font);line-height:1.05;margin:0">hedef-ekle</p></div>
</main>
</body>
</html>
