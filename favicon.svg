<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes sandFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -12; }
      }
      @keyframes duneBreathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes sandSink {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(0.5px); }
      }
      .sand-stream {
        stroke-dasharray: 4 2;
        animation: sandFlow 0.3s linear infinite;
      }
      .dune-breathe {
        transform-origin: 32px 53px;
        animation: duneBreathe 2.4s ease-in-out infinite;
      }
      .upper-sand {
        animation: sandSink 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Dark Monolith Squircle Badge -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- Architectural Plates (Top & Base) -->
  <rect x="9" y="6" width="46" height="5" rx="1.5" fill="#F4F4F0"/>
  <rect x="9" y="53" width="46" height="5" rx="1.5" fill="#F4F4F0"/>

  <!-- Hourglass Glass Contour (Crisp Bone-Silver Shell) -->
  <path d="M 14 11 C 14 24 25.5 29 26.5 32 C 25.5 35 14 40 14 53 L 50 53 C 50 40 38.5 35 37.5 32 C 38.5 29 50 24 50 11 Z" 
        fill="#121212" stroke="#E6E6E2" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Glass Interior Depth Shadow -->
  <path d="M 16 12 C 16 23 26 28 27 32 C 26 36 16 41 16 52 L 48 52 C 48 41 38 36 37 32 C 38 28 48 23 48 12 Z" 
        fill="#161616"/>

  <!-- UPPER CHAMBER: Draining Sand Mass -->
  <!-- Main Bone-White Sand Body (Funnel Slope) -->
  <g class="upper-sand">
    <path d="M 17 18 C 19 22 25 27 32 31.5 C 39 27 45 22 47 18 C 45 15 39 13.5 32 13.5 C 25 13.5 19 15 17 18 Z" 
          fill="#F4F4F0"/>
    <!-- Funnel Depression / Shading -->
    <path d="M 21 17 C 24 20 28 23 32 25 C 36 23 40 20 43 17 C 40 15 36 14.2 32 14.2 C 28 14.2 24 15 21 17 Z" 
          fill="#D8D8D2"/>
    <!-- Crimson Vortex Funnel Origin -->
    <path d="M 28 21 C 29.5 23.5 31 27 32 31 C 33 27 34.5 23.5 36 21 C 34.5 20.2 33.2 20 32 20 C 30.8 20 29.5 20.2 28 21 Z" 
          fill="#E63946"/>
  </g>

  <!-- Continuous Laser Sand Stream Through Neck -->
  <line x1="32" y1="31" x2="32" y2="48.5" stroke="#E63946" stroke-width="2.8" stroke-linecap="round" class="sand-stream">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.3s" repeatCount="indefinite" />
  </line>

  <!-- Glowing Falling Particles (SMIL + CSS) -->
  <circle cx="32" cy="34" r="1.4" fill="#FFFFFF">
    <animate attributeName="cy" values="31;48.5" dur="0.46s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="0.46s" repeatCount="indefinite" />
  </circle>
  <circle cx="32" cy="40" r="1.2" fill="#FF808E">
    <animate attributeName="cy" values="31;49" dur="0.46s" begin="0.23s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="0.46s" begin="0.23s" repeatCount="indefinite" />
  </circle>

  <!-- LOWER CHAMBER: Accumulated Sand Dune -->
  <g class="dune-breathe">
    <path d="M 16 53 C 21 46.5 26.5 42.5 32 42.5 C 37.5 42.5 43 46.5 48 53 Z" fill="#F4F4F0">
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
    </path>
    <!-- Crimson Apex Dune Peak (Where Sand Lands) -->
    <path d="M 24 53 C 27 48.2 29.5 45.8 32 45.8 C 34.5 45.8 37 48.2 40 53 Z" fill="#E63946" opacity="0.95"/>
    <!-- Dune Ripple / Impact Point -->
    <ellipse cx="32" cy="45.5" rx="2" ry="0.6" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- Neck Collar Ring (Crisp Metallic Accent) -->
  <ellipse cx="32" cy="32" rx="4.8" ry="1.3" fill="none" stroke="#555555" stroke-width="1.2"/>

  <!-- Tactile Specular Glass Glare Reflections -->
  <path d="M 17 14 C 16 19 18 24 21 27" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
  <path d="M 47 14 C 48 19 46 24 43 27" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.15"/>
</svg>
